name: worker

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run python -m compileall app tests scripts
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv build
      - name: Generate CycloneDX SBOM
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file dist/requirements.txt
          uvx --from cyclonedx-bom cyclonedx-py requirements dist/requirements.txt --pyproject pyproject.toml --output-reproducible --of JSON -o dist/sbom.cdx.json
          test -s dist/sbom.cdx.json
      - run: uvx pip-audit -r dist/requirements.txt
      - name: Attest tagged Python release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: dist/*

  sidecar:
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: ai-agent-worker-x86_64-pc-windows-msvc.exe
          # PyInstaller Linux artifacts are only forward-compatible with newer glibc.
          # Build on the oldest Linux release supported by the desktop package.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: ai-agent-worker-x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
            binary: ai-agent-worker-aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Build sidecar
        run: >-
          uv run python scripts/build_sidecar.py
          --target-triple ${{ matrix.target }}
          --output-dir artifacts
      - name: Smoke-test sidecar
        run: uv run python scripts/smoke_sidecar.py artifacts/${{ matrix.binary }}
      - name: Attest tagged sidecar artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: artifacts/*
      - name: Upload sidecar and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-agent-worker-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
