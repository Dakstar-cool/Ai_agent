name: worker

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run python -m compileall app tests scripts
      - run: uv run ruff check .

  sidecar:
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: ai-agent-worker-x86_64-pc-windows-msvc.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: ai-agent-worker-x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
            binary: ai-agent-worker-aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Build sidecar
        run: >-
          uv run python scripts/build_sidecar.py
          --target-triple ${{ matrix.target }}
          --output-dir artifacts
      - name: Smoke-test sidecar
        run: uv run python scripts/smoke_sidecar.py artifacts/${{ matrix.binary }}
      - name: Upload sidecar and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-worker-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
