[project]
name = "ai-agentv1"
version = "0.8.4"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.3",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.36,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
    "opentelemetry-sdk>=1.36,<2",
    "pydantic>=2.13.1",
    "pydantic-settings>=2.13.1",
    "pytest>=9.0.3",
    "uvicorn>=0.44.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["data*", "logs*", "tests*"]
namespaces = false

[dependency-groups]
dev = [
    "pyinstaller==6.21.0",
    "pre-commit>=4.6.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 88
